<!doctype html>
<html>

<head>

<meta charset="utf-8">

<meta
  http-equiv="Content-Security-Policy"
  content="
    default-src 'self' data:;
    img-src 'self' data: https: http:;
    style-src 'self' 'unsafe-inline';
    script-src 'self' 'unsafe-inline';
    connect-src 'self';
  "
>

<title>Music Visualizer</title>

<style>

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: black;
  overflow: hidden;
  cursor: none;
}

canvas {
  width: 100%;
  height: 100%;
  display: block;
}


/*
==================================================
START BUTTON
==================================================
*/

#start {
  position: fixed;
  inset: 0;
  margin: auto;

  width: 260px;
  height: 70px;

  font-size: 20px;

  z-index: 50;

  cursor: pointer;
}


/*
==================================================
AUDIO STATUS
==================================================
*/

#audio-status {
  position: fixed;

  left: 20px;
  bottom: 18px;

  z-index: 40;

  color: white;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  font-size: 12px;

  opacity: 0.60;
}


/*
==================================================
SPOTIFY PANEL
==================================================
*/

#spotify-panel {
  position: fixed;

  top: 33px;
  right: 33px;

  width: 585px;

  padding: 21px;

  display: none;

  align-items: center;

  gap: 23px;

  box-sizing: border-box;

  color: white;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background:
    rgba(
      0,
      0,
      0,
      0.72
    );

  border:
    1px solid
    rgba(
      255,
      255,
      255,
      0.22
    );

  border-radius: 21px;

  backdrop-filter:
    blur(8px);

  z-index: 30;
}


#spotify-art {
  width: 150px;
  height: 150px;

  flex-shrink: 0;

  object-fit: cover;

  border-radius: 14px;

  background:
    rgba(
      255,
      255,
      255,
      0.08
    );
}


#spotify-info {
  flex: 1;
  min-width: 0;
}


#spotify-status {
  font-size: 15px;

  text-transform: uppercase;

  letter-spacing: 2.25px;

  opacity: 0.55;

  margin-bottom: 8px;
}


#spotify-title {
  font-size: 29px;

  font-weight: 700;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;

  margin-bottom: 8px;
}


#spotify-artist {
  font-size: 23px;

  opacity: 0.85;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;

  margin-bottom: 6px;
}


#spotify-album {
  font-size: 18px;

  opacity: 0.55;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;

  margin-bottom: 18px;
}


#spotify-progress {
  width: 100%;

  height: 8px;

  overflow: hidden;

  border-radius: 30px;

  background:
    rgba(
      255,
      255,
      255,
      0.16
    );
}


#spotify-progress-fill {
  width: 0%;

  height: 100%;

  border-radius: 30px;

  background: white;
}


#spotify-time {
  margin-top: 8px;

  display: flex;

  justify-content:
    space-between;

  font-size: 16px;

  opacity: 0.55;
}

</style>

</head>


<body>


<div id="spotify-panel">

  <img
    id="spotify-art"
    alt="Album artwork"
  >

  <div id="spotify-info">

    <div id="spotify-status">
      NOW PLAYING
    </div>

    <div id="spotify-title">
      Song
    </div>

    <div id="spotify-artist">
      Artist
    </div>

    <div id="spotify-album">
      Album
    </div>

    <div id="spotify-progress">

      <div
        id="spotify-progress-fill">
      </div>

    </div>

    <div id="spotify-time">

      <span id="spotify-position">
        0:00
      </span>

      <span id="spotify-duration">
        0:00
      </span>

    </div>

  </div>

</div>


<button id="start">
  Start Live Visualizer
</button>


<div id="audio-status">
  Waiting to start
</div>


<canvas id="canvas"></canvas>


<script>


/*
==================================================
CANVAS
==================================================
*/

const canvas =
  document.getElementById(
    "canvas"
  );


const ctx =
  canvas.getContext(
    "2d",
    {
      alpha: false
    }
  );


const startButton =
  document.getElementById(
    "start"
  );


const audioStatus =
  document.getElementById(
    "audio-status"
  );


function resize() {

  canvas.width =
    window.innerWidth;

  canvas.height =
    window.innerHeight;

}


window.addEventListener(
  "resize",
  resize
);


resize();


/*
==================================================
SPOTIFY ELEMENTS
==================================================
*/

const spotifyPanel =
  document.getElementById(
    "spotify-panel"
  );


const spotifyArt =
  document.getElementById(
    "spotify-art"
  );


const spotifyStatus =
  document.getElementById(
    "spotify-status"
  );


const spotifyTitle =
  document.getElementById(
    "spotify-title"
  );


const spotifyArtist =
  document.getElementById(
    "spotify-artist"
  );


const spotifyAlbum =
  document.getElementById(
    "spotify-album"
  );


const spotifyProgressFill =
  document.getElementById(
    "spotify-progress-fill"
  );


const spotifyPosition =
  document.getElementById(
    "spotify-position"
  );


const spotifyDuration =
  document.getElementById(
    "spotify-duration"
  );


/*
==================================================
SPOTIFY STATE
==================================================
*/

let spotifyState =
  null;


let spotifySyncTime =
  performance.now();


function formatTime(ms) {

  if (
    !Number.isFinite(ms) ||
    ms < 0
  ) {

    return "0:00";

  }


  const seconds =
    Math.floor(
      ms /
      1000
    );


  const minutes =
    Math.floor(
      seconds /
      60
    );


  const remaining =
    seconds %
    60;


  return (
    minutes +
    ":" +
    String(
      remaining
    ).padStart(
      2,
      "0"
    )
  );

}


/*
==================================================
UPDATE SPOTIFY
==================================================
*/

async function updateSpotify() {

  if (
    !window.spotify
  ) {

    return;

  }


  try {

    const data =
      await window.spotify
        .getNowPlaying();


    if (
      !data ||
      !data.available
    ) {

      spotifyPanel.style.display =
        "none";


      spotifyState =
        null;


      return;

    }


    spotifyState =
      data;


    spotifySyncTime =
      performance.now();


    spotifyPanel.style.display =
      "flex";


    spotifyTitle.textContent =
      data.title ||
      "Unknown Song";


    spotifyArtist.textContent =
      data.artist ||
      "Unknown Artist";


    spotifyAlbum.textContent =
      data.album ||
      "";


    spotifyStatus.textContent =
      data.isPlaying

        ? "NOW PLAYING"

        : "PAUSED";


    if (
      data.artUrl &&
      spotifyArt.src !==
        data.artUrl
    ) {

      spotifyArt.src =
        data.artUrl;

    }


    spotifyDuration.textContent =
      formatTime(
        data.durationMs
      );


  } catch (error) {

    console.error(
      "Spotify update error:",
      error
    );

  }

}


/*
Metadata does not need very frequent polling.
*/

setInterval(
  updateSpotify,
  2000
);


updateSpotify();


/*
==================================================
SPOTIFY PROGRESS
==================================================
*/

let lastSpotifyUiUpdate =
  0;


function updateSpotifyProgress(
  time
) {

  requestAnimationFrame(
    updateSpotifyProgress
  );


  /*
  Only update Spotify DOM roughly
  10 times per second.
  */

  if (
    time -
    lastSpotifyUiUpdate <
    100
  ) {

    return;

  }


  lastSpotifyUiUpdate =
    time;


  if (
    !spotifyState
  ) {

    return;

  }


  let position =
    spotifyState.positionMs;


  if (
    spotifyState.isPlaying
  ) {

    position +=
      performance.now() -
      spotifySyncTime;

  }


  position =
    Math.max(
      0,
      Math.min(
        position,
        spotifyState.durationMs
      )
    );


  const percentage =

    spotifyState.durationMs >
      0

      ?

      (
        position /
        spotifyState.durationMs
      ) *
      100

      :

      0;


  spotifyProgressFill.style.width =
    percentage +
    "%";


  spotifyPosition.textContent =
    formatTime(
      position
    );


  spotifyDuration.textContent =
    formatTime(
      spotifyState.durationMs
    );

}


requestAnimationFrame(
  updateSpotifyProgress
);


/*
==================================================
AUDIO STATE
==================================================
*/

let audioContext =
  null;


let pcmNode =
  null;


let analyser =
  null;


let silentGain =
  null;


let removeAudioListener =
  null;


let visualizerStarted =
  false;


/*
==================================================
PCM CONVERSION
==================================================
*/

function pcm16ToFloat32(
  arrayBuffer
) {

  const input =
    new Int16Array(
      arrayBuffer
    );


  const output =
    new Float32Array(
      input.length
    );


  for (
    let i = 0;
    i <
      input.length;
    i++
  ) {

    output[i] =
      input[i] /
      32768;

  }


  return output;

}


/*
==================================================
START VISUALIZER
==================================================
*/

startButton.onclick =
  async () => {


  if (
    visualizerStarted
  ) {

    return;

  }


  try {


    audioStatus.textContent =
      "Starting live PipeWire capture...";


    /*
    ==================================================
    AUDIO CONTEXT
    ==================================================
    */

    audioContext =
      new AudioContext({

        sampleRate:
          48000,

        latencyHint:
          "interactive"

      });


    await audioContext.resume();


    /*
    ==================================================
    PCM STREAM QUEUE
    ==================================================

    This deliberately does NOT use AudioWorklet.

    That avoids the packaged AppImage problem
    loading pcm-worklet.js.
    */

    const pcmQueue =
      [];


    let currentPCM =
      null;


    let currentPCMOffset =
      0;


    let queuedSamples =
      0;


    /*
    Roughly 500ms maximum queue.

    If rendering falls behind, old audio gets
    discarded so the visualizer remains live.
    */

    const maxQueuedSamples =
      48000 *
      2 *
      0.50;


    /*
    ==================================================
    SCRIPT PROCESSOR
    ==================================================
    */

    pcmNode =
      audioContext
        .createScriptProcessor(
          2048,
          0,
          2
        );


    function getNextPCMSample() {

      while (
        !currentPCM ||
        currentPCMOffset >=
          currentPCM.length
      ) {

        if (
          pcmQueue.length ===
          0
        ) {

          currentPCM =
            null;


          currentPCMOffset =
            0;


          return 0;

        }


        currentPCM =
          pcmQueue.shift();


        queuedSamples -=
          currentPCM.length;


        currentPCMOffset =
          0;

      }


      const sample =
        currentPCM[
          currentPCMOffset
        ];


      currentPCMOffset++;


      return sample;

    }


    pcmNode.onaudioprocess =
      (
        event
      ) => {


        const left =
          event.outputBuffer
            .getChannelData(
              0
            );


        const right =
          event.outputBuffer
            .getChannelData(
              1
            );


        for (
          let i = 0;
          i <
            left.length;
          i++
        ) {

          left[i] =
            getNextPCMSample();


          right[i] =
            getNextPCMSample();

        }

      };


    /*
    ==================================================
    ANALYSER
    ==================================================
    */

    analyser =
      audioContext
        .createAnalyser();


    /*
    Lower FFT size reduces computation.
    */

    analyser.fftSize =
      2048;


    analyser.smoothingTimeConstant =
      0.65;


    analyser.minDecibels =
      -95;


    analyser.maxDecibels =
      -10;


    /*
    ==================================================
    SILENT AUDIO GRAPH
    ==================================================
    */

    silentGain =
      audioContext
        .createGain();


    silentGain.gain.value =
      0;


    pcmNode.connect(
      analyser
    );


    analyser.connect(
      silentGain
    );


    silentGain.connect(
      audioContext.destination
    );


    /*
    ==================================================
    RECEIVE LIVE PCM
    ==================================================
    */

    removeAudioListener =
      window.systemAudio
        .onData(
          (
            data
          ) => {


            const samples =
              pcm16ToFloat32(
                data
              );


            pcmQueue.push(
              samples
            );


            queuedSamples +=
              samples.length;


            /*
            Remove stale buffered audio if needed.
            */

            while (
              queuedSamples >
                maxQueuedSamples &&
              pcmQueue.length >
                1
            ) {

              const dropped =
                pcmQueue.shift();


              queuedSamples -=
                dropped.length;

            }

          }
        );


    /*
    ==================================================
    AUDIO ERROR
    ==================================================
    */

    window.systemAudio
      .onError(
        (
          message
        ) => {

          console.error(
            "Live audio error:",
            message
          );


          audioStatus.textContent =
            "Audio error: " +
            message;

        }
      );


    /*
    ==================================================
    START PAREC
    ==================================================
    */

    const result =
      await window.systemAudio
        .start();


    if (
      !result ||
      !result.success
    ) {

      throw new Error(
        "Could not start system audio capture."
      );

    }


    console.log(
      "LIVE AUDIO:",
      result
    );


    audioStatus.textContent =
      "LIVE • PipeWire system audio";


    startButton.remove();


    visualizerStarted =
      true;


    /*
    ==================================================
    FREQUENCY DATA
    ==================================================
    */

    const spectrum =
      new Uint8Array(
        analyser.frequencyBinCount
      );


    /*
    ==================================================
    GLOBAL ENERGY
    ==================================================
    */

    let smoothBass =
      0;


    let huePosition =
      0;


    /*
    ==================================================
    BAR SETTINGS
    ==================================================
    */

    const barCount =
      48;


    const smoothBars =
      new Float32Array(
        barCount
      );


    /*
    Current slower motion settings.
    */

    const barRiseSpeed =
      0.60;


    const barFallSpeed =
      0.12;


    /*
    Maximum bar height = 60% screen.
    */

    const heightMultiplier =
      0.60;


    /*
    ==================================================
    FREQUENCY SETTINGS
    ==================================================
    */

    const minFreq =
      45;


    const maxFreq =
      14000;


    const nyquist =
      audioContext.sampleRate /
      2;


    function frequencyToBin(
      freq
    ) {

      return Math.round(

        freq /
        nyquist *
        spectrum.length

      );

    }


    /*
    ==================================================
    PRECOMPUTE BASS BINS
    ==================================================
    */

    const bassStart =
      frequencyToBin(
        45
      );


    const bassEnd =
      frequencyToBin(
        250
      );


    /*
    ==================================================
    PRECOMPUTE BAR RANGES
    ==================================================
    */

    const barRanges =
      new Array(
        barCount
      );


    const centerBoosts =
      new Float32Array(
        barCount
      );


    const centerSensitivityBars =
      18;


    for (
      let i = 0;
      i <
        barCount;
      i++
    ) {


      const fraction1 =
        i /
        barCount;


      const fraction2 =
        (
          i +
          1
        ) /
        barCount;


      const freq1 =
        minFreq *
        Math.pow(
          maxFreq /
          minFreq,
          fraction1
        );


      const freq2 =
        minFreq *
        Math.pow(
          maxFreq /
          minFreq,
          fraction2
        );


      let startBin =
        frequencyToBin(
          freq1
        );


      let endBin =
        frequencyToBin(
          freq2
        );


      startBin =
        Math.max(
          0,
          startBin
        );


      endBin =
        Math.min(
          spectrum.length -
            1,
          endBin
        );


      if (
        endBin <=
        startBin
      ) {

        endBin =
          Math.min(
            spectrum.length -
              1,
            startBin +
              1
          );

      }


      barRanges[i] = {

        startBin,

        endBin

      };


      /*
      Slight center boost.

      Starts at 1.35x and smoothly falls
      to approximately 1.0x.

      It never drops below 1.0.
      */

      if (
        i <
        centerSensitivityBars
      ) {

        centerBoosts[i] =
          1.1 -
          (
            i /
            centerSensitivityBars
          ) *
          0.35;

      } else {

        centerBoosts[i] =
          1.0;

      }

    }


    /*
    ==================================================
    RENDER SETTINGS
    ==================================================
    */

    let lastFrameTime =
      0;


    const targetFPS =
      30;


    const frameInterval =
      1000 /
      targetFPS;


    /*
    ==================================================
    DRAW
    ==================================================
    */

    function draw(
      currentTime
    ) {


      requestAnimationFrame(
        draw
      );


      const elapsed =
        currentTime -
        lastFrameTime;


      if (
        elapsed <
        frameInterval
      ) {

        return;

      }


      lastFrameTime =
        currentTime -
        (
          elapsed %
          frameInterval
        );


      analyser
        .getByteFrequencyData(
          spectrum
        );


      /*
      ==================================================
      BASS ENERGY
      ==================================================
      */

      let bass =
        0;


      for (
        let i =
          bassStart;
        i <
          bassEnd;
        i++
      ) {

        bass +=
          spectrum[i];

      }


      bass /=
        Math.max(
          1,
          bassEnd -
            bassStart
        );


      smoothBass +=
        (
          bass -
          smoothBass
        ) *
        0.12;


      /*
      ==================================================
      COLOR
      ==================================================
      */

      const hueSpeed =
        0.10 +
        smoothBass /
        220;


      huePosition +=
        hueSpeed;


      if (
        huePosition >=
        360
      ) {

        huePosition -=
          360;

      }


      const hue =
        (
          huePosition +
          smoothBass *
          0.8
        ) %
        360;


      /*
      ==================================================
      CLEAR SCREEN
      ==================================================
      */

      ctx.fillStyle =
        "#000";


      ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
      );


      /*
      ==================================================
      GEOMETRY
      ==================================================
      */

      const centerX =
        canvas.width *
        0.5;


      const halfWidth =
        canvas.width *
        0.5;


      const barWidth =
        halfWidth /
        barCount;


      const actualBarWidth =
        Math.max(
          1,
          barWidth -
            2
        );


      /*
      ==================================================
      DRAW BARS
      ==================================================
      */

      for (
        let i = 0;
        i <
          barCount;
        i++
      ) {


        const range =
          barRanges[i];


        let value =
          0;


        for (
          let j =
            range.startBin;
          j <=
            range.endBin;
          j++
        ) {

          const sample =
            spectrum[j];


          if (
            sample >
            value
          ) {

            value =
              sample;

          }

        }


        /*
        ==================================================
        SENSITIVITY
        ==================================================
        */

        const noiseGate =
          0.015;


        let normalized =
          value /
          255;


        if (
          normalized <
          noiseGate
        ) {

          normalized =
            0;

        } else {

          normalized =
            (
              normalized -
              noiseGate
            ) /
            (
              1 -
              noiseGate
            );


          normalized =
            Math.pow(
              normalized,
              0.48
            );


          normalized *=
            centerBoosts[i];

        }


        normalized =
          Math.min(
            1,
            Math.max(
              0,
              normalized
            )
          );


        /*
        ==================================================
        SMOOTHING
        ==================================================
        */

        if (
          normalized >
          smoothBars[i]
        ) {

          smoothBars[i] +=
            (
              normalized -
              smoothBars[i]
            ) *
            barRiseSpeed;

        } else {

          smoothBars[i] +=
            (
              normalized -
              smoothBars[i]
            ) *
            barFallSpeed;

        }


        if (
          smoothBars[i] <
          0.003
        ) {

          smoothBars[i] =
            0;

        }


        const displayedValue =
          smoothBars[i];


        /*
        ==================================================
        HEIGHT
        ==================================================
        */

        const height =
          displayedValue *
          canvas.height *
          heightMultiplier;


        /*
        ==================================================
        BAR COLOR
        ==================================================
        */

        const barHue =
          (
            hue +
            i *
            3 +
            value *
            0.12
          ) %
          360;


        const barLightness =
          35 +
          displayedValue *
          35;


        const barColor =
          `hsl(${barHue}, 95%, ${barLightness}%)`;


        ctx.fillStyle =
          barColor;


        /*
        Reduced glow for performance.
        */

        ctx.shadowColor =
          barColor;


        ctx.shadowBlur =
          2 +
          displayedValue *
          6;


        /*
        ==================================================
        MIRRORED BARS
        ==================================================
        */

        const offset =
          i *
          barWidth;


        const rightX =
          centerX +
          offset;


        const leftX =
          centerX -
          offset -
          barWidth;


        const y =
          canvas.height -
          height;


        ctx.fillRect(
          rightX,
          y,
          actualBarWidth,
          height
        );


        ctx.fillRect(
          leftX,
          y,
          actualBarWidth,
          height
        );

      }


      ctx.shadowBlur =
        0;

    }


    requestAnimationFrame(
      draw
    );


  } catch (error) {


    console.error(
      error
    );


    audioStatus.textContent =
      "Could not start live audio";


    alert(
      "Could not start live system audio.\n\n" +
      error.message
    );

  }

};


/*
==================================================
STOP ON EXIT
==================================================
*/

window.addEventListener(
  "beforeunload",
  () => {


    if (
      removeAudioListener
    ) {

      removeAudioListener();

    }


    if (
      window.systemAudio
    ) {

      window.systemAudio
        .stop();

    }

  }
);


</script>

</body>

</html>
