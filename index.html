<title>Music Visualizer</title>

<style>

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: black;
  overflow: hidden;

  font-family:
    Arial,
    Helvetica,
    sans-serif;
}


body.running {
  cursor: none;
}


canvas {
  width: 100%;
  height: 100%;
  display: block;
}


/*
==================================================
VISUALIZER SELECTOR
==================================================
*/

#visualizer-picker {
  position: fixed;
  inset: 0;

  z-index: 100;

  display: flex;
  align-items: center;
  justify-content: center;

  background:
    radial-gradient(
      circle at center,
      rgba(25, 25, 32, 0.95),
      rgba(0, 0, 0, 1) 70%
    );

  color: white;
}


#picker-content {
  width: min(
    920px,
    calc(100% - 60px)
  );

  text-align: center;
}


#picker-title {
  margin: 0 0 10px 0;

  font-size: 42px;

  font-weight: 700;
}


#picker-subtitle {
  margin: 0 0 36px 0;

  font-size: 17px;

  opacity: 0.65;
}


#visualizer-options {
  display: grid;

  grid-template-columns:
    repeat(
      2,
      minmax(0, 1fr)
    );

  gap: 24px;
}


.visualizer-choice {
  min-height: 280px;

  padding: 28px;

  color: white;

  background:
    rgba(
      255,
      255,
      255,
      0.055
    );

  border:
    1px solid
    rgba(
      255,
      255,
      255,
      0.17
    );

  border-radius: 20px;

  cursor: pointer;

  text-align: left;

  transition:
    transform 150ms ease,
    background 150ms ease,
    border-color 150ms ease;
}


.visualizer-choice:hover {
  transform:
    translateY(-4px);

  background:
    rgba(
      255,
      255,
      255,
      0.095
    );

  border-color:
    rgba(
      255,
      255,
      255,
      0.35
    );
}


.visualizer-choice:disabled {
  cursor: wait;

  opacity: 0.45;
}


.choice-preview {
  height: 120px;

  margin-bottom: 24px;

  display: flex;

  align-items: flex-end;

  justify-content: center;

  gap: 5px;

  overflow: hidden;
}


.preview-spectrum span {
  width: 11px;

  border-radius:
    3px 3px 0 0;

  background:
    linear-gradient(
      to top,
      #5d4cff,
      #e74cff
    );
}


.preview-spectrum span:nth-child(1),
.preview-spectrum span:nth-child(12) {
  height: 25%;
}

.preview-spectrum span:nth-child(2),
.preview-spectrum span:nth-child(11) {
  height: 38%;
}

.preview-spectrum span:nth-child(3),
.preview-spectrum span:nth-child(10) {
  height: 52%;
}

.preview-spectrum span:nth-child(4),
.preview-spectrum span:nth-child(9) {
  height: 68%;
}

.preview-spectrum span:nth-child(5),
.preview-spectrum span:nth-child(8) {
  height: 85%;
}

.preview-spectrum span:nth-child(6),
.preview-spectrum span:nth-child(7) {
  height: 100%;
}


.preview-pixels {
  align-items: center;

  gap: 7px;
}


.preview-pixels span {
  width: 13px;
  height: 13px;

  border-radius: 2px;

  background:
    rgba(
      255,
      255,
      255,
      0.10
    );
}


.preview-pixels span:nth-child(4),
.preview-pixels span:nth-child(5),
.preview-pixels span:nth-child(6),
.preview-pixels span:nth-child(7),
.preview-pixels span:nth-child(8),
.preview-pixels span:nth-child(9) {
  background:
    linear-gradient(
      135deg,
      #4edcff,
      #bd48ff
    );

  box-shadow:
    0 0 10px
    rgba(
      140,
      90,
      255,
      0.75
    );
}


.choice-name {
  font-size: 24px;

  font-weight: 700;

  margin-bottom: 8px;
}


.choice-description {
  font-size: 14px;

  line-height: 1.5;

  opacity: 0.62;
}


/*
==================================================
AUDIO STATUS
==================================================
*/

#audio-status {
  position: fixed;

  left: 20px;
  bottom: 18px;

  z-index: 40;

  color: white;

  font-size: 12px;

  opacity: 0.60;
}


/*
==================================================
SPOTIFY PANEL
==================================================
*/

#spotify-panel {
  position: fixed;

  top: 33px;
  right: 33px;

  width: 585px;

  padding: 21px;

  display: none;

  align-items: center;

  gap: 23px;

  box-sizing: border-box;

  color: white;

  background:
    rgba(
      0,
      0,
      0,
      0.72
    );

  border:
    1px solid
    rgba(
      255,
      255,

    );

  border-radius: 21px;

  backdrop-filter:

}


#spotify-art {

#spotify-info {

}


#spotify-status {

#spotify-title {

#spotify-artist {

#spotify-album {

#spotify-progress {

#spotify-progress-fill {

}


#spotify-time {

}


@media (

) {

  #visualizer-options {
    grid-template-columns:

  }

  #picker-title {
    font-size: 32px;
  }

}

<script>


/*
==================================================
ELEMENTS
==================================================
*/

const canvas =
  document.getElementById(
    "canvas"
  );


const ctx =
  canvas.getContext(
    "2d",
    {
      alpha:
        false
    }
  );


const visualizerPicker =
  document.getElementById(
    "visualizer-picker"
  );


const pickerSubtitle =
  document.getElementById(
    "picker-subtitle"
  );


const choiceButtons =
  document.querySelectorAll(
    ".visualizer-choice"
  );


const audioStatus =
  document.getElementById(
    "audio-status"
  );


/*
==================================================
CANVAS SIZE
==================================================
*/

function resize() {

  canvas.width =
    window.innerWidth;


  canvas.height =
    window.innerHeight;

}


window.addEventListener(
  "resize",
  resize
);


resize();


/*
==================================================
SPOTIFY ELEMENTS
==================================================
*/

const spotifyPanel =
  document.getElementById(
    "spotify-panel"
  );


const spotifyArt =
  document.getElementById(
    "spotify-art"
  );


const spotifyStatus =
  document.getElementById(
    "spotify-status"
  );


const spotifyTitle =
  document.getElementById(
    "spotify-title"
  );


const spotifyArtist =
  document.getElementById(
    "spotify-artist"
  );


const spotifyAlbum =
  document.getElementById(
    "spotify-album"
  );


const spotifyProgressFill =
  document.getElementById(
    "spotify-progress-fill"
  );


const spotifyPosition =
  document.getElementById(
    "spotify-position"
  );


const spotifyDuration =
  document.getElementById(
    "spotify-duration"
  );


/*
==================================================
SPOTIFY STATE
==================================================
*/

let spotifyState =
  null;


let spotifySyncTime =
  performance.now();


function formatTime(ms) {

  if (
    !Number.isFinite(
      ms
    ) ||
    ms <
      0
  ) {

    return "0:00";

  }


  const seconds =
    Math.floor(
      ms /
      1000
    );


  const minutes =
    Math.floor(
      seconds /
      60
    );


  const remaining =
    seconds %
    60;


  return (
    minutes +
    ":" +
    String(
      remaining
    ).padStart(
      2,
      "0"
    )
  );

}


/*
==================================================
SPOTIFY UPDATE
==================================================
*/

async function updateSpotify() {

  if (
    !window.spotify
  ) {

    return;

  }


  try {

    const data =
      await window.spotify
        .getNowPlaying();


    if (
      !data ||
      !data.available
    ) {

      spotifyPanel.style.display =
        "none";


      spotifyState =
        null;


      return;

    }


    spotifyState =
      data;


    spotifySyncTime =
      performance.now();


    spotifyPanel.style.display =
      "flex";


    spotifyTitle.textContent =
      data.title ||
      "Unknown Song";


    spotifyArtist.textContent =
      data.artist ||
      "Unknown Artist";


    spotifyAlbum.textContent =
      data.album ||
      "";


    spotifyStatus.textContent =
      data.isPlaying

        ? "NOW PLAYING"

        : "PAUSED";


    if (
      data.artUrl &&
      spotifyArt.src !==
        data.artUrl
    ) {

      spotifyArt.src =
        data.artUrl;

    }


    spotifyDuration.textContent =
      formatTime(
        data.durationMs
      );


  } catch (error) {

    console.error(
      "Spotify update error:",
      error
    );

  }

}


setInterval(
  updateSpotify,
  2000
);


updateSpotify();


/*
==================================================
SPOTIFY TIMER
==================================================
*/

let lastSpotifyUiUpdate =
  0;


function updateSpotifyProgress(
  time
) {

  requestAnimationFrame(
    updateSpotifyProgress
  );


  /*
  Only update the DOM 10x per second.
  */

  if (
    time -
    lastSpotifyUiUpdate <
    100
  ) {

    return;

  }


  lastSpotifyUiUpdate =
    time;


  if (
    !spotifyState
  ) {

    return;

  }


  let position =
    spotifyState.positionMs;


  if (
    spotifyState.isPlaying
  ) {

    position +=
      performance.now() -
      spotifySyncTime;

  }


  position =
    Math.max(
      0,
      Math.min(
        position,
        spotifyState.durationMs
      )
    );


  const percentage =

    spotifyState.durationMs >
      0

      ?

      (
        position /
        spotifyState.durationMs
      ) *
      100

      :

      0;


  spotifyProgressFill.style.width =
    percentage +
    "%";


  spotifyPosition.textContent =
    formatTime(
      position
    );


  spotifyDuration.textContent =
    formatTime(
      spotifyState.durationMs
    );

}


requestAnimationFrame(
  updateSpotifyProgress
);


/*
==================================================
AUDIO STATE
==================================================
*/

let audioContext =
  null;


let pcmNode =
  null;


let analyser =
  null;


let silentGain =
  null;


let removeAudioListener =
  null;


let visualizerStarted =
  false;


let activeVisualizer =
  null;


/*
==================================================
PCM CONVERSION
==================================================
*/

function pcm16ToFloat32(
  arrayBuffer
) {

  const input =
    new Int16Array(
      arrayBuffer
    );


  const output =
    new Float32Array(
      input.length
    );


  for (
    let i = 0;
    i <
      input.length;
    i++
  ) {

    output[i] =
      input[i] /
      32768;

  }


  return output;

}


/*
==================================================
START AUDIO + VISUALIZER
==================================================
*/

async function startVisualizer(
  mode
) {

  if (
    visualizerStarted
  ) {

    return;

  }


  activeVisualizer =
    mode;


  /*
  Disable selector while audio starts.
  */

  choiceButtons.forEach(
    button => {

      button.disabled =
        true;

    }
  );


  pickerSubtitle.textContent =
    "Starting live PipeWire audio...";


  try {


    if (
      !window.systemAudio
    ) {

      throw new Error(
        "systemAudio interface is not available."
      );

    }


    /*
    ==================================================
    AUDIO CONTEXT
    ==================================================
    */

    audioContext =
      new AudioContext({

        sampleRate:
          48000,

        latencyHint:
          "interactive"

      });


    await audioContext.resume();


    /*
    ==================================================
    PCM QUEUE
    ==================================================

    We deliberately use ScriptProcessor here rather
    than loading a separate AudioWorklet module.

    This keeps the packaged AppImage working.
    */

    const pcmQueue =
      [];


    let currentPCM =
      null;


    let currentPCMOffset =
      0;


    let queuedSamples =
      0;


    const maxQueuedSamples =
      48000 *
      2 *
      0.50;


    /*
    ==================================================
    PCM PROCESSOR
    ==================================================
    */

    pcmNode =
      audioContext
        .createScriptProcessor(
          2048,
          0,
          2
        );


    function getNextPCMSample() {

      while (
        !currentPCM ||
        currentPCMOffset >=
          currentPCM.length
      ) {


        if (
          pcmQueue.length ===
          0
        ) {

          currentPCM =
            null;


          currentPCMOffset =
            0;


          return 0;

        }


        currentPCM =
          pcmQueue.shift();


        queuedSamples -=
          currentPCM.length;


        currentPCMOffset =
          0;

      }


      const sample =
        currentPCM[
          currentPCMOffset
        ];


      currentPCMOffset++;


      return sample;

    }


    pcmNode.onaudioprocess =
      event => {


        const left =
          event.outputBuffer
            .getChannelData(
              0
            );


        const right =
          event.outputBuffer
            .getChannelData(
              1
            );


        for (
          let i = 0;
          i <
            left.length;
          i++
        ) {

          left[i] =
            getNextPCMSample();


          right[i] =
            getNextPCMSample();

        }

      };


    /*
    ==================================================
    ANALYSER
    ==================================================
    */

    analyser =
      audioContext
        .createAnalyser();


    analyser.fftSize =
      mode === "pixels"
        ? 1024
        : 2048;


    analyser.smoothingTimeConstant =
      0.65;


    analyser.minDecibels =
      -95;


    analyser.maxDecibels =
      -10;


    /*
    ==================================================
    SILENT GRAPH
    ==================================================
    */

    silentGain =
      audioContext
        .createGain();


    silentGain.gain.value =
      0;


    pcmNode.connect(
      analyser
    );


    analyser.connect(
      silentGain
    );


    silentGain.connect(
      audioContext.destination
    );


    /*
    ==================================================
    RECEIVE PIPEWIRE PCM
    ==================================================
    */

    removeAudioListener =
      window.systemAudio
        .onData(
          data => {


            const samples =
              pcm16ToFloat32(
                data
              );


            pcmQueue.push(
              samples
            );


            queuedSamples +=
              samples.length;


            /*
            Drop old data rather than letting
            visualizer latency build up.
            */

            while (
              queuedSamples >
                maxQueuedSamples &&
              pcmQueue.length >
                1
            ) {

              const dropped =
                pcmQueue.shift();


              queuedSamples -=
                dropped.length;

            }

          }
        );


    /*
    ==================================================
    AUDIO ERRORS
    ==================================================
    */

    window.systemAudio
      .onError(
        message => {

          console.error(
            "Live audio error:",
            message
          );


          audioStatus.textContent =
            "Audio error: " +
            message;

        }
      );


    /*
    ==================================================
    START PAREC
    ==================================================
    */

    const result =
      await window.systemAudio
        .start();


    if (
      !result ||
      !result.success
    ) {

      throw new Error(
        "Could not start live system audio."
      );

    }


    visualizerStarted =
      true;


    document.body.classList.add(
      "running"
    );


    visualizerPicker.style.display =
      "none";


    audioStatus.textContent =
      mode ===
        "spectrum"

        ? "LIVE • Visualizer 1"

        : "LIVE • Visualizer 2";


    /*
    ==================================================
    VISUALIZER DATA
    ==================================================
    */

    const spectrum =
      new Uint8Array(
        analyser.frequencyBinCount
      );


    const nyquist =
      audioContext.sampleRate /
      2;


    function frequencyToBin(
      frequency
    ) {

      return Math.round(

        frequency /
        nyquist *
        spectrum.length

      );

    }


    /*
    ==================================================
    SHARED FREQUENCY RANGES
    ==================================================
    */

    const bassStart =
      frequencyToBin(
        45
      );


    const bassEnd =
      frequencyToBin(
        250
      );


    const meterStart =
      frequencyToBin(
        45
      );


    const meterEnd =
      frequencyToBin(
        6000
      );


    /*
    ==================================================
    VISUALIZER 1 SETTINGS
    ==================================================
    */

    const barCount =
      48;


    const smoothBars =
      new Float32Array(
        barCount
      );


    const barRiseSpeed =
      0.60;


    const barFallSpeed =
      0.12;


    const heightMultiplier =
      0.60;


    const minFreq =
      45;


    const maxFreq =
      14000;


    const barRanges =
      new Array(
        barCount
      );


    const centerBoosts =
      new Float32Array(
        barCount
      );


    const centerSensitivityBars =
      18;


    /*
    Calculate spectrum ranges once.
    */

    for (
      let i = 0;
      i <
        barCount;
      i++
    ) {


      const fraction1 =
        i /
        barCount;


      const fraction2 =
        (
          i +
          1
        ) /
        barCount;


      const freq1 =
        minFreq *
        Math.pow(
          maxFreq /
          minFreq,
          fraction1
        );


      const freq2 =
        minFreq *
        Math.pow(
          maxFreq /
          minFreq,
          fraction2
        );


      let startBin =
        frequencyToBin(
          freq1
        );


      let endBin =
        frequencyToBin(
          freq2
        );


      startBin =
        Math.max(
          0,
          startBin
        );


      endBin =
        Math.min(
          spectrum.length -
            1,
          endBin
        );


      if (
        endBin <=
        startBin
      ) {

        endBin =
          Math.min(
            spectrum.length -
              1,
            startBin +
              1
          );

      }


      barRanges[i] = {

        startBin,

        endBin

      };


      /*
      Slight center boost.
      */

      if (
        i <
        centerSensitivityBars
      ) {

        centerBoosts[i] =
          1.35 -
          (
            i /
            centerSensitivityBars
          ) *
          0.35;

      } else {

        centerBoosts[i] =
          1.0;

      }

    }


    /*
    ==================================================
    VISUALIZER 2 SETTINGS
    ==================================================
    */

    /*
    Number of squares on EACH side
    of the center.
    */

    const pixelSegments =
      24;


    let smoothPixelLevel =
      0;


    const pixelRiseSpeed =
      0.55;


    const pixelFallSpeed =
      0.35;


    /*
    ==================================================
    SHARED ANIMATION STATE
    ==================================================
    */

    let smoothBass =
      0;


    let huePosition =
      0;


    let lastFrameTime =
      0;


    const targetFPS =
      30;


    const frameInterval =
      1000 /
      targetFPS;


    /*
    ==================================================
    DRAW VISUALIZER 1
    ==================================================
    */

    function drawSpectrumVisualizer(
      hue
    ) {


      const centerX =
        canvas.width *
        0.5;


      const halfWidth =
        canvas.width *
        0.5;


      const barWidth =
        halfWidth /
        barCount;


      const actualBarWidth =
        Math.max(
          1,
          barWidth -
            2
        );


      for (
        let i = 0;
        i <
          barCount;
        i++
      ) {


        const range =
          barRanges[i];


        let value =
          0;


        for (
          let j =
            range.startBin;
          j <=
            range.endBin;
          j++
        ) {

          if (
            spectrum[j] >
            value
          ) {

            value =
              spectrum[j];

          }

        }


        /*
        Sensitivity.
        */

        const noiseGate =
          0.015;


        let normalized =
          value /
          255;


        if (
          normalized <
          noiseGate
        ) {

          normalized =
            0;

        } else {

          normalized =
            (
              normalized -
              noiseGate
            ) /
            (
              1 -
              noiseGate
            );


          normalized =
            Math.pow(
              normalized,
              0.48
            );


          normalized *=
            centerBoosts[i];

        }


        normalized =
          Math.min(
            1,
            Math.max(
              0,
              normalized
            )
          );


        /*
        Bar smoothing.
        */

        if (
          normalized >
          smoothBars[i]
        ) {

          smoothBars[i] +=
            (
              normalized -
              smoothBars[i]
            ) *
            barRiseSpeed;

        } else {

          smoothBars[i] +=
            (
              normalized -
              smoothBars[i]
            ) *
            barFallSpeed;

        }


        if (
          smoothBars[i] <
          0.003
        ) {

          smoothBars[i] =
            0;

        }


        const displayedValue =
          smoothBars[i];


        const height =
          displayedValue *
          canvas.height *
          heightMultiplier;


        const barHue =
          (
            hue +
            i *
            3 +
            value *
            0.12
          ) %
          360;


        const lightness =
          35 +
          displayedValue *
          35;


        const color =
          `hsl(${barHue}, 95%, ${lightness}%)`;


        ctx.fillStyle =
          color;


        ctx.shadowColor =
          color;


        ctx.shadowBlur =
          2 +
          displayedValue *
          6;


        const offset =
          i *
          barWidth;


        const rightX =
          centerX +
          offset;


        const leftX =
          centerX -
          offset -
          barWidth;


        const y =
          canvas.height -
          height;


        ctx.fillRect(
          rightX,
          y,
          actualBarWidth,
          height
        );


        ctx.fillRect(
          leftX,
          y,
          actualBarWidth,
          height
        );

      }


      ctx.shadowBlur =
        0;

    }


    /*
    ==================================================
    DRAW VISUALIZER 2
    ==================================================

    Pixel meter sits approximately 40%
    down the screen.

    Squares illuminate outward from the center.
    ==================================================
    */

    function drawPixelVisualizer(
      hue
    ) {


      /*
      Get overall music energy.
      */

      let sum =
        0;


      let peak =
        0;


      let count =
        0;


      for (
        let i =
          meterStart;
        i <
          meterEnd;
        i++
      ) {

        const value =
          spectrum[i];


        sum +=
          value;


        if (
          value >
          peak
        ) {

          peak =
            value;

        }


        count++;

      }


      const average =
        count >
          0

          ?

          sum /
          count

          :

          0;


      /*
      Blend average energy and strongest peak.
      */

      let rawLevel =
        (
          average *
          0.70 +
          peak *
          0.30
        ) /
        255;


      /*
      Remove low-level noise.
      */

      rawLevel =
        Math.max(
          0,
          (
            rawLevel -
            0.03
          ) /
          0.55
        );


      rawLevel =
        Math.min(
          1,
          Math.pow(
            rawLevel,
            0.58
          )
        );


      /*
      Smooth growth and decay.
      */

      if (
        rawLevel >
        smoothPixelLevel
      ) {

        smoothPixelLevel +=
          (
            rawLevel -
            smoothPixelLevel
          ) *
          pixelRiseSpeed;

      } else {

        smoothPixelLevel +=
          (
            rawLevel -
            smoothPixelLevel
          ) *
          pixelFallSpeed;

      }


      /*
      ==================================================
      PIXEL GEOMETRY
      ==================================================
      */

      const centerX =
        canvas.width *
        0.5;


      /*
      Position bar at 40% of screen height.
      */

      const centerY =
        canvas.height *
        0.40;


      /*
      Bar can occupy about 82% of screen width.
      */

      const maxHalfWidth =
        canvas.width *
        0.41;


      const step =
        maxHalfWidth /
        pixelSegments;


      const squareSize =
        Math.max(
          12,
          Math.min(
            24,
            step -
              5
          )
        );


      /*
      Number of illuminated squares
      on each side.
      */

      const illuminated =
        Math.round(
          smoothPixelLevel *
          pixelSegments
        );


      /*
      Draw dim inactive squares first.
      */

      ctx.shadowBlur =
        0;


      for (
        let i = 0;
        i <
          pixelSegments;
        i++
      ) {


        const distance =
          (
            i +
            0.5
          ) *
          step;


        const leftX =
          centerX -
          distance -
          squareSize /
          2;


        const rightX =
          centerX +
          distance -
          squareSize /
          2;


        const y =
          centerY -
          squareSize /
          2;


        ctx.fillStyle =
          "rgba(255, 255, 255, 0.055)";


        ctx.fillRect(
          leftX,
          y,
          squareSize,
          squareSize
        );


        ctx.fillRect(
          rightX,
          y,
          squareSize,
          squareSize
        );

      }


      /*
      Draw illuminated squares.
      */

      for (
        let i = 0;
        i <
          illuminated;
        i++
      ) {


        const distance =
          (
            i +
            0.5
          ) *
          step;


        const leftX =
          centerX -
          distance -
          squareSize /
          2;


        const rightX =
          centerX +
          distance -
          squareSize /
          2;


        const y =
          centerY -
          squareSize /
          2;


        /*
        Colors move from the center outward.
        */

        const segmentHue =
          (
            hue +
            i *
            3.7
          ) %
          360;


        const progress =
          illuminated >
            0

            ?

            i /
            illuminated

            :

            0;


        const lightness =
          62 -
          progress *
          12;


        const color =
          `hsl(${segmentHue}, 95%, ${lightness}%)`;


        ctx.fillStyle =
          color;


        ctx.shadowColor =
          color;


        /*
        Keep glow modest for casting performance.
        */

        ctx.shadowBlur =
          2;


        ctx.fillRect(
          leftX,
          y,
          squareSize,
          squareSize
        );


        ctx.fillRect(
          rightX,
          y,
          squareSize,
          squareSize
        );

      }


      /*
      Bright center marker.
      */

      const centerHue =
        (
          hue +
          15
        ) %
        360;


      const centerColor =
        `hsl(${centerHue}, 100%, 68%)`;


      ctx.fillStyle =
        centerColor;


      ctx.shadowColor =
        centerColor;


      ctx.shadowBlur =
        6;


      ctx.fillRect(
        centerX -
          squareSize /
          2,
        centerY -
          squareSize /
          2,
        squareSize,
        squareSize
      );


      ctx.shadowBlur =
        0;

    }


    /*
    ==================================================
    MASTER DRAW LOOP
    ==================================================
    */

    function draw(
      currentTime
    ) {


      requestAnimationFrame(
        draw
      );


      const elapsed =
        currentTime -
        lastFrameTime;


      if (
        elapsed <
        frameInterval
      ) {

        return;

      }


      lastFrameTime =
        currentTime -
        (
          elapsed %
          frameInterval
        );


      analyser
        .getByteFrequencyData(
          spectrum
        );


      /*
      Shared bass energy used for color movement.
      */

      let bass =
        0;


      for (
        let i =
          bassStart;
        i <
          bassEnd;
        i++
      ) {

        bass +=
          spectrum[i];

      }


      bass /=
        Math.max(
          1,
          bassEnd -
            bassStart
        );


      smoothBass +=
        (
          bass -
          smoothBass
        ) *
        0.12;


      /*
      Dynamic color movement.
      */

      const hueSpeed =
        0.12 +
        smoothBass /
        260;


      huePosition +=
        hueSpeed;


      if (
        huePosition >=
        360
      ) {

        huePosition -=
          360;

      }


      const hue =
        (
          huePosition +
          smoothBass *
          0.75
        ) %
        360;


      /*
      Clear canvas.
      */

      ctx.shadowBlur =
        0;


      ctx.fillStyle =
        "#000";


      ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
      );


      /*
      Draw selected visualization.
      */

      if (
        activeVisualizer ===
        "pixels"
      ) {

        drawPixelVisualizer(
          hue
        );

      } else {

        drawSpectrumVisualizer(
          hue
        );

      }

    }


    requestAnimationFrame(
      draw
    );


  } catch (error) {


    console.error(
      error
    );


    audioStatus.textContent =
      "Could not start live audio";


    pickerSubtitle.textContent =
      "Could not start visualizer: " +
      error.message;


    choiceButtons.forEach(
      button => {

        button.disabled =
          false;

      }
    );


    visualizerStarted =
      false;

  }

}


/*
==================================================
VISUALIZER SELECTION
==================================================
*/

choiceButtons.forEach(
  button => {

    button.addEventListener(
      "click",
      () => {

        const mode =
          button.dataset.mode;


        startVisualizer(
          mode
        );

      }
    );

  }
);


/*
==================================================
STOP AUDIO ON EXIT
==================================================
*/

window.addEventListener(
  "beforeunload",
  () => {


    if (
      removeAudioListener
    ) {

      removeAudioListener();

    }


    if (
      window.systemAudio
    ) {

      window.systemAudio
        .stop();

    }

  }
);


</script>
