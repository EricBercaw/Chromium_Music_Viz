<!doctype html>
<html>
<head>
<meta charset="utf-8">

<meta
  http-equiv="Content-Security-Policy"
  content="
    default-src 'self' data:;
    img-src 'self' data: https: http:;
    style-src 'self' 'unsafe-inline';
    script-src 'self' 'unsafe-inline';
    connect-src 'self';
  "
>

<title>Music Visualizer</title>

<style>

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: black;
  overflow: hidden;
  cursor: none;
}

canvas {
  width: 100%;
  height: 100%;
  display: block;
}

/*
==================================================
START BUTTON
==================================================
*/

#start {
  position: fixed;
  inset: 0;
  margin: auto;
  width: 260px;
  height: 70px;
  font-size: 20px;
  z-index: 50;
  cursor: pointer;
}

/*
==================================================
AUDIO STATUS
==================================================
*/

#audio-status {
  position: fixed;
  left: 20px;
  bottom: 18px;
  z-index: 40;
  color: white;
  font-family: Arial, Helvetica, sans-serif;
  font-size: 12px;
  opacity: 0.60;
}

/*
==================================================
SPOTIFY NOW PLAYING
==================================================
*/

#spotify-panel {
  position: fixed;
  top: 33px;
  right: 33px;

  width: 585px;
  padding: 21px;

  display: none;
  align-items: center;
  gap: 23px;

  box-sizing: border-box;

  color: white;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background:
    rgba(
      0,
      0,
      0,
      0.72
    );

  border:
    1px solid
    rgba(
      255,
      255,
      255,
      0.22
    );

  border-radius: 21px;

  /*
  Blur can cost GPU time while casting.

  Reduced from 14px to 8px.
  */
  backdrop-filter: blur(8px);

  z-index: 30;
}

#spotify-art {
  width: 150px;
  height: 150px;

  flex-shrink: 0;

  object-fit: cover;

  border-radius: 14px;

  background:
    rgba(
      255,
      255,
      255,
      0.08
    );
}

#spotify-info {
  flex: 1;
  min-width: 0;
}

#spotify-status {
  font-size: 15px;
  text-transform: uppercase;
  letter-spacing: 2.25px;
  opacity: 0.55;
  margin-bottom: 8px;
}

#spotify-title {
  font-size: 29px;
  font-weight: 700;

  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;

  margin-bottom: 8px;
}

#spotify-artist {
  font-size: 23px;
  opacity: 0.85;

  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;

  margin-bottom: 6px;
}

#spotify-album {
  font-size: 18px;
  opacity: 0.55;

  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;

  margin-bottom: 18px;
}

#spotify-progress {
  width: 100%;
  height: 8px;

  overflow: hidden;

  border-radius: 30px;

  background:
    rgba(
      255,
      255,
      255,
      0.16
    );
}

#spotify-progress-fill {
  width: 0%;
  height: 100%;

  border-radius: 30px;

  background: white;
}

#spotify-time {
  margin-top: 8px;

  display: flex;

  justify-content:
    space-between;

  font-size: 16px;

  opacity: 0.55;
}

</style>
</head>

<body>

<div id="spotify-panel">

  <img
    id="spotify-art"
    alt="Album artwork"
  >

  <div id="spotify-info">

    <div id="spotify-status">
      NOW PLAYING
    </div>

    <div id="spotify-title">
      Song
    </div>

    <div id="spotify-artist">
      Artist
    </div>

    <div id="spotify-album">
      Album
    </div>

    <div id="spotify-progress">
      <div id="spotify-progress-fill"></div>
    </div>

    <div id="spotify-time">

      <span id="spotify-position">
        0:00
      </span>

      <span id="spotify-duration">
        0:00
      </span>

    </div>

  </div>

</div>

<button id="start">
  Start Live Visualizer
</button>

<div id="audio-status">
  Waiting to start
</div>

<canvas id="canvas"></canvas>

<script>

/*
==================================================
CANVAS
==================================================
*/

const canvas =
  document.getElementById(
    "canvas"
  );

const ctx =
  canvas.getContext(
    "2d",
    {
      alpha: false
    }
  );

const startButton =
  document.getElementById(
    "start"
  );

const audioStatus =
  document.getElementById(
    "audio-status"
  );

function resize() {

  canvas.width =
    window.innerWidth;

  canvas.height =
    window.innerHeight;

}

window.addEventListener(
  "resize",
  resize
);

resize();

/*
==================================================
SPOTIFY ELEMENTS
==================================================
*/

const spotifyPanel =
  document.getElementById(
    "spotify-panel"
  );

const spotifyArt =
  document.getElementById(
    "spotify-art"
  );

const spotifyStatus =
  document.getElementById(
    "spotify-status"
  );

const spotifyTitle =
  document.getElementById(
    "spotify-title"
  );

const spotifyArtist =
  document.getElementById(
    "spotify-artist"
  );

const spotifyAlbum =
  document.getElementById(
    "spotify-album"
  );

const spotifyProgressFill =
  document.getElementById(
    "spotify-progress-fill"
  );

const spotifyPosition =
  document.getElementById(
    "spotify-position"
  );

const spotifyDuration =
  document.getElementById(
    "spotify-duration"
  );

/*
==================================================
SPOTIFY STATE
==================================================
*/

let spotifyState =
  null;

let spotifySyncTime =
  performance.now();

function formatTime(ms) {

  if (
    !Number.isFinite(ms) ||
    ms < 0
  ) {

    return "0:00";

  }

  const seconds =
    Math.floor(
      ms /
      1000
    );

  const minutes =
    Math.floor(
      seconds /
      60
    );

  const remaining =
    seconds %
    60;

  return (
    minutes +
    ":" +
    String(
      remaining
    ).padStart(
      2,
      "0"
    )
  );

}

/*
==================================================
UPDATE SPOTIFY
==================================================
*/

async function updateSpotify() {

  if (
    !window.spotify
  ) {

    return;

  }

  try {

    const data =
      await window.spotify
        .getNowPlaying();

    if (
      !data ||
      !data.available
    ) {

      spotifyPanel.style.display =
        "none";

      spotifyState =
        null;

      return;

    }

    spotifyState =
      data;

    spotifySyncTime =
      performance.now();

    spotifyPanel.style.display =
      "flex";

    spotifyTitle.textContent =
      data.title ||
      "Unknown Song";

    spotifyArtist.textContent =
      data.artist ||
      "Unknown Artist";

    spotifyAlbum.textContent =
      data.album ||
      "";

    spotifyStatus.textContent =
      data.isPlaying
        ? "NOW PLAYING"
        : "PAUSED";

    if (
      data.artUrl &&
      spotifyArt.src !==
        data.artUrl
    ) {

      spotifyArt.src =
        data.artUrl;

    }

    spotifyDuration.textContent =
      formatTime(
        data.durationMs
      );

  } catch (error) {

    console.error(
      "Spotify update error:",
      error
    );

  }

}

/*
Slightly less frequent metadata polling.
It does not need to run very often because
the timer below interpolates locally.
*/

setInterval(
  updateSpotify,
  2000
);

updateSpotify();

/*
==================================================
SPOTIFY PROGRESS
==================================================
*/

let lastSpotifyUiUpdate =
  0;

function updateSpotifyProgress(
  time
) {

  requestAnimationFrame(
    updateSpotifyProgress
  );

  /*
  Updating DOM text 60 times per second is
  unnecessary.

  Update approximately 10 times per second.
  */

  if (
    time -
    lastSpotifyUiUpdate <
    100
  ) {

    return;

  }

  lastSpotifyUiUpdate =
    time;

  if (
    !spotifyState
  ) {

    return;

  }

  let position =
    spotifyState.positionMs;

  if (
    spotifyState.isPlaying
  ) {

    position +=
      performance.now() -
      spotifySyncTime;

  }

  position =
    Math.max(
      0,
      Math.min(
        position,
        spotifyState.durationMs
      )
    );

  const percentage =
    spotifyState.durationMs >
      0

      ?

      (
        position /
        spotifyState.durationMs
      ) *
      100

      :

      0;

  spotifyProgressFill.style.width =
    percentage +
    "%";

  spotifyPosition.textContent =
    formatTime(
      position
    );

  spotifyDuration.textContent =
    formatTime(
      spotifyState.durationMs
    );

}

requestAnimationFrame(
  updateSpotifyProgress
);

/*
==================================================
AUDIO STATE
==================================================
*/

let audioContext =
  null;

let pcmNode =
  null;

let analyser =
  null;

let silentGain =
  null;

let removeAudioListener =
  null;

let visualizerStarted =
  false;

/*
==================================================
INT16 PCM -> FLOAT32
==================================================
*/

function pcm16ToFloat32(
  arrayBuffer
) {

  const input =
    new Int16Array(
      arrayBuffer
    );

  const output =
    new Float32Array(
      input.length
    );

  for (
    let i = 0;
    i <
      input.length;
    i++
  ) {

    output[i] =
      input[i] /
      32768;

  }

  return output;

}

/*
==================================================
START VISUALIZER
==================================================
*/

startButton.onclick =
  async () => {

  if (
    visualizerStarted
  ) {

    return;

  }

  try {

    audioStatus.textContent =
      "Starting live PipeWire capture...";

    /*
    ==================================================
    AUDIO CONTEXT
    ==================================================
    */

    audioContext =
      new AudioContext({

        sampleRate:
          48000,

        latencyHint:
          "interactive"

      });

    await audioContext.resume();

    /*
    ==================================================
    PCM WORKLET
    ==================================================
    */

    await audioContext.audioWorklet
      .addModule(
        "./pcm-worklet.js"
      );

    pcmNode =
      new AudioWorkletNode(
        audioContext,
        "pcm-stream-processor",
        {

          numberOfInputs:
            0,

          numberOfOutputs:
            1,

          outputChannelCount:
            [
              2
            ]

        }
      );

    /*
    ==================================================
    ANALYSER
    ==================================================
    */

    analyser =
      audioContext
        .createAnalyser();

    /*
    PERFORMANCE:

    4096 -> 2048

    Half as many FFT bins.
    Still more than enough for 48 visual bars.
    */

    analyser.fftSize =
      2048;

    /*
    Slightly higher smoothing helps a
    30 FPS visualizer still look fluid.
    */

    analyser.smoothingTimeConstant =
      0.65;

    analyser.minDecibels =
      -95;

    analyser.maxDecibels =
      -10;

    /*
    ==================================================
    SILENT OUTPUT
    ==================================================
    */

    silentGain =
      audioContext
        .createGain();

    silentGain.gain.value =
      0;

    pcmNode.connect(
      analyser
    );

    analyser.connect(
      silentGain
    );

    silentGain.connect(
      audioContext.destination
    );

    /*
    ==================================================
    RECEIVE PCM
    ==================================================
    */

    removeAudioListener =
      window.systemAudio
        .onData(
          (
            data
          ) => {

            const samples =
              pcm16ToFloat32(
                data
              );

            pcmNode.port
              .postMessage(
                {
                  samples
                },
                [
                  samples.buffer
                ]
              );

          }
        );

    /*
    ==================================================
    ERRORS
    ==================================================
    */

    window.systemAudio
      .onError(
        (
          message
        ) => {

          console.error(
            "Live audio error:",
            message
          );

          audioStatus.textContent =
            "Audio error: " +
            message;

        }
      );

    /*
    ==================================================
    START PAREC
    ==================================================
    */

    const result =
      await window.systemAudio
        .start();

    if (
      !result ||
      !result.success
    ) {

      throw new Error(
        "Could not start system audio capture."
      );

    }

    console.log(
      "LIVE AUDIO:",
      result
    );

    audioStatus.textContent =
      "LIVE • PipeWire system audio";

    startButton.remove();

    visualizerStarted =
      true;

    /*
    ==================================================
    FREQUENCY DATA
    ==================================================
    */

    const spectrum =
      new Uint8Array(
        analyser.frequencyBinCount
      );

    /*
    ==================================================
    GLOBAL SMOOTHING
    ==================================================
    */

    let smoothBass =
      0;

    let smoothMids =
      0;

    let smoothTreble =
      0;

    let huePosition =
      0;

    /*
    ==================================================
    BAR SETTINGS
    ==================================================
    */

    /*
    PERFORMANCE:

    64 -> 48 bars.

    Because the bars are mirrored, this means
    96 rectangles instead of 128 per frame.
    */

    const barCount =
      48;

    const smoothBars =
      new Float32Array(
        barCount
      );

    /*
    Slower motion settings.
    */

    const barRiseSpeed =
      0.60;

    const barFallSpeed =
      0.12;

    /*
    Maximum screen height occupied by bars.
    */

    const heightMultiplier =
      0.58;

    /*
    ==================================================
    FREQUENCY SETTINGS
    ==================================================
    */

    const minFreq =
      45;

    const maxFreq =
      14000;

    const nyquist =
      audioContext.sampleRate /
      2;

    function frequencyToBin(
      freq
    ) {

      return Math.round(

        freq /
        nyquist *
        spectrum.length

      );

    }

    /*
    ==================================================
    PRECOMPUTE ENERGY BINS
    ==================================================

    These values never change during playback,
    so there is no reason to calculate them
    every frame.
    */

    const bassStart =
      frequencyToBin(
        45
      );

    const bassEnd =
      frequencyToBin(
        250
      );

    const midEnd =
      frequencyToBin(
        4000
      );

    const trebleEnd =
      frequencyToBin(
        12000
      );

    /*
    ==================================================
    PRECOMPUTE BAR FREQUENCY RANGES
    ==================================================

    Previously Math.pow() and frequencyToBin()
    ran for every bar, every frame.

    Now they run ONCE.
    */

    const barRanges =
      new Array(
        barCount
      );

    const centerBoosts =
      new Float32Array(
        barCount
      );

    const centerSensitivityBars =
      18;

    for (
      let i = 0;
      i <
        barCount;
      i++
    ) {

      const fraction1 =
        i /
        barCount;

      const fraction2 =
        (
          i +
          1
        ) /
        barCount;

      const freq1 =
        minFreq *
        Math.pow(
          maxFreq /
          minFreq,
          fraction1
        );

      const freq2 =
        minFreq *
        Math.pow(
          maxFreq /
          minFreq,
          fraction2
        );

      let startBin =
        frequencyToBin(
          freq1
        );

      let endBin =
        frequencyToBin(
          freq2
        );

      startBin =
        Math.max(
          0,
          startBin
        );

      endBin =
        Math.min(
          spectrum.length -
            1,
          endBin
        );

      if (
        endBin <=
        startBin
      ) {

        endBin =
          Math.min(
            spectrum.length -
              1,
            startBin +
              1
          );

      }

      barRanges[i] = {
        startBin,
        endBin
      };

      /*
      Center/bass sensitivity.
      */

      centerBoosts[i] =
        i <
          centerSensitivityBars

          ?

          1.10 -
          (
            i /
            centerSensitivityBars
          ) *
          0.30

          :

          1.0;

    }

    /*
    ==================================================
    DRAW SETTINGS
    ==================================================
    */

    let lastFrameTime =
      0;

    /*
    PERFORMANCE:

    Cap render at 30 FPS.

    Audio continues running at full rate;
    only visual drawing is reduced.
    */

    const targetFPS =
      30;

    const frameInterval =
      1000 /
      targetFPS;

    /*
    ==================================================
    DRAW
    ==================================================
    */

    function draw(
      currentTime
    ) {

      requestAnimationFrame(
        draw
      );

      /*
      FPS limiter.
      */

      const elapsed =
        currentTime -
        lastFrameTime;

      if (
        elapsed <
        frameInterval
      ) {

        return;

      }

      /*
      Prevent accumulating timing error.
      */

      lastFrameTime =
        currentTime -
        (
          elapsed %
          frameInterval
        );

      analyser
        .getByteFrequencyData(
          spectrum
        );

      /*
      ==================================================
      FREQUENCY ENERGY
      ==================================================
      */

      let bass =
        0;

      let mids =
        0;

      let treble =
        0;

      for (
        let i =
          bassStart;

        i <
          bassEnd;

        i++
      ) {

        bass +=
          spectrum[i];

      }

      bass /=
        Math.max(
          1,
          bassEnd -
            bassStart
        );

      for (
        let i =
          bassEnd;

        i <
          midEnd;

        i++
      ) {

        mids +=
          spectrum[i];

      }

      mids /=
        Math.max(
          1,
          midEnd -
            bassEnd
        );

      for (
        let i =
          midEnd;

        i <
          trebleEnd;

        i++
      ) {

        treble +=
          spectrum[i];

      }

      treble /=
        Math.max(
          1,
          trebleEnd -
            midEnd
        );

      smoothBass +=
        (
          bass -
          smoothBass
        ) *
        0.12;

      smoothMids +=
        (
          mids -
          smoothMids
        ) *
        0.10;

      smoothTreble +=
        (
          treble -
          smoothTreble
        ) *
        0.10;

      /*
      ==================================================
      DYNAMIC COLOR
      ==================================================
      */

      const hueSpeed =
        0.10 +
        smoothBass /
        220;

      huePosition +=
        hueSpeed;

      if (
        huePosition >=
        360
      ) {

        huePosition -=
          360;

      }

      const hue =
        (
          huePosition +
          smoothBass *
          0.8
        ) %
        360;

      /*
      ==================================================
      CLEAR SCREEN
      ==================================================
      */

      ctx.fillStyle =
        "#000";

      ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
      );

      /*
      ==================================================
      GEOMETRY
      ==================================================
      */

      const centerX =
        canvas.width *
        0.5;

      const halfWidth =
        canvas.width *
        0.5;

      const barWidth =
        halfWidth /
        barCount;

      const actualBarWidth =
        Math.max(
          1,
          barWidth -
            2
        );

      /*
      ==================================================
      DRAW BARS
      ==================================================
      */

      for (
        let i = 0;
        i <
          barCount;
        i++
      ) {

        const range =
          barRanges[i];

        let value =
          0;

        /*
        Find strongest FFT bin inside
        this precomputed frequency band.
        */

        for (
          let j =
            range.startBin;

          j <=
            range.endBin;

          j++
        ) {

          const sample =
            spectrum[j];

          if (
            sample >
            value
          ) {

            value =
              sample;

          }

        }

        /*
        ==================================================
        SENSITIVITY
        ==================================================
        */

        const noiseGate =
          0.015;

        let normalized =
          value /
          255;

        if (
          normalized <
          noiseGate
        ) {

          normalized =
            0;

        } else {

          normalized =
            (
              normalized -
              noiseGate
            ) /
            (
              1 -
              noiseGate
            );

          normalized =
            Math.pow(
              normalized,
              0.48
            );

          normalized *=
            centerBoosts[i];

        }

        if (
          normalized >
          1
        ) {

          normalized =
            1;

        }

        /*
        ==================================================
        SMOOTHING
        ==================================================
        */

        if (
          normalized >
          smoothBars[i]
        ) {

          smoothBars[i] +=
            (
              normalized -
              smoothBars[i]
            ) *
            barRiseSpeed;

        } else {

          smoothBars[i] +=
            (
              normalized -
              smoothBars[i]
            ) *
            barFallSpeed;

        }

        if (
          smoothBars[i] <
          0.003
        ) {

          smoothBars[i] =
            0;

        }

        const displayedValue =
          smoothBars[i];

        /*
        ==================================================
        HEIGHT
        ==================================================
        */

        const height =
          displayedValue *
          canvas.height *
          heightMultiplier;

        /*
        ==================================================
        COLOR
        ==================================================
        */

        const barHue =
          (
            hue +
            i *
            3 +
            value *
            0.12
          ) %
          360;

        const barLightness =
          35 +
          displayedValue *
          35;

        const barColor =
          `hsl(${barHue}, 95%, ${barLightness}%)`;

        ctx.fillStyle =
          barColor;

        /*
        PERFORMANCE:

        Previous glow:

        4 + displayedValue * 18

        New glow is dramatically cheaper.
        */

        ctx.shadowColor =
          barColor;

        ctx.shadowBlur =
          2 +
          displayedValue *
          6;

        /*
        ==================================================
        MIRRORED POSITION
        ==================================================
        */

        const offset =
          i *
          barWidth;

        const rightX =
          centerX +
          offset;

        const leftX =
          centerX -
          offset -
          barWidth;

        const y =
          canvas.height -
          height;

        ctx.fillRect(
          rightX,
          y,
          actualBarWidth,
          height
        );

        ctx.fillRect(
          leftX,
          y,
          actualBarWidth,
          height
        );

      }

      /*
      Disable shadow before next clear.
      */

      ctx.shadowBlur =
        0;

    }

    /*
    IMPORTANT:

    Start the first frame correctly with
    a requestAnimationFrame timestamp.
    */

    requestAnimationFrame(
      draw
    );

  } catch (error) {

    console.error(
      error
    );

    audioStatus.textContent =
      "Could not start live audio";

    alert(
      "Could not start live system audio.\n\n" +
      error.message
    );

  }

};

/*
==================================================
STOP ON EXIT
==================================================
*/

window.addEventListener(
  "beforeunload",
  () => {

    if (
      removeAudioListener
    ) {

      removeAudioListener();

    }

    if (
      window.systemAudio
    ) {

      window.systemAudio
        .stop();

    }

  }
);

</script>

</body>
</html>
