<!doctype html>

<html>

<head>

<meta charset="utf-8">

<title>Music Visualizer</title>


<style>

html,
body {

  margin: 0;

  width: 100%;

  height: 100%;

  background: black;

  overflow: hidden;

  cursor: none;

}


canvas {

  width: 100%;

  height: 100%;

  display: block;

}


/*
==================================================
START BUTTON
==================================================
*/

#start {

  position: fixed;

  inset: 0;

  margin: auto;

  width: 240px;

  height: 64px;

  font-size: 20px;

  z-index: 50;

  cursor: pointer;

}


/*
==================================================
APPLE TV CAST BUTTON
==================================================
*/

#cast-button {

  position: fixed;

  top: 22px;

  left: 22px;

  z-index: 40;

  padding:
    11px 17px;

  color: white;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  font-size: 14px;

  background:
    rgba(
      0,
      0,
      0,
      0.72
    );

  border:
    1px solid
    rgba(
      255,
      255,
      255,
      0.30
    );

  border-radius:
    10px;

  cursor:
    pointer;

  backdrop-filter:
    blur(12px);

  transition:
    background 0.2s,
    border 0.2s;

}


#cast-button:hover {

  background:
    rgba(
      255,
      255,
      255,
      0.16
    );

  border-color:
    rgba(
      255,
      255,
      255,
      0.55
    );

}


#cast-button:disabled {

  opacity:
    0.6;

}


/*
==================================================
SPOTIFY NOW PLAYING
==================================================
*/

#spotify-panel {

  position: fixed;

  top: 22px;

  right: 22px;

  width: 390px;

  padding: 14px;

  display: none;

  align-items: center;

  gap: 15px;

  box-sizing: border-box;

  color: white;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background:
    rgba(
      0,
      0,
      0,
      0.72
    );

  border:
    1px solid
    rgba(
      255,
      255,
      255,
      0.22
    );

  border-radius:
    14px;

  backdrop-filter:
    blur(14px);

  z-index: 30;

}


#spotify-art {

  width: 100px;

  height: 100px;

  flex-shrink: 0;

  object-fit: cover;

  border-radius: 9px;

  background:
    rgba(
      255,
      255,
      255,
      0.08
    );

}


#spotify-info {

  flex: 1;

  min-width: 0;

}


#spotify-status {

  font-size: 10px;

  text-transform: uppercase;

  letter-spacing: 1.5px;

  opacity: 0.55;

  margin-bottom: 5px;

}


#spotify-title {

  font-size: 19px;

  font-weight: 700;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;

  margin-bottom: 5px;

}


#spotify-artist {

  font-size: 15px;

  opacity: 0.85;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;

  margin-bottom: 4px;

}


#spotify-album {

  font-size: 12px;

  opacity: 0.55;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;

  margin-bottom: 12px;

}


#spotify-progress {

  width: 100%;

  height: 5px;

  overflow: hidden;

  border-radius: 20px;

  background:
    rgba(
      255,
      255,
      255,
      0.16
    );

}


#spotify-progress-fill {

  width: 0%;

  height: 100%;

  border-radius: 20px;

  background: white;

}


#spotify-time {

  margin-top: 5px;

  display: flex;

  justify-content: space-between;

  font-size: 11px;

  opacity: 0.55;

}

</style>

</head>


<body>


<!-- =============================================
APPLE TV
============================================= -->

<button id="cast-button">

  Cast to Apple TV

</button>


<!-- =============================================
SPOTIFY
============================================= -->

<div id="spotify-panel">

  <img
    id="spotify-art"
    alt="Album artwork"
  >


  <div id="spotify-info">

    <div id="spotify-status">

      NOW PLAYING

    </div>


    <div id="spotify-title">

      Song

    </div>


    <div id="spotify-artist">

      Artist

    </div>


    <div id="spotify-album">

      Album

    </div>


    <div id="spotify-progress">

      <div
        id="spotify-progress-fill">
      </div>

    </div>


    <div id="spotify-time">

      <span id="spotify-position">

        0:00

      </span>


      <span id="spotify-duration">

        0:00

      </span>

    </div>

  </div>

</div>


<!-- =============================================
START
============================================= -->

<button id="start">

  Start Visualizer

</button>


<canvas id="canvas"></canvas>


<script>


/*
==================================================
CANVAS
==================================================
*/

const canvas =
  document.getElementById(
    "canvas"
  );


const ctx =
  canvas.getContext(
    "2d"
  );


const startButton =
  document.getElementById(
    "start"
  );


function resize() {

  canvas.width =
    window.innerWidth;

  canvas.height =
    window.innerHeight;

}


window.addEventListener(
  "resize",
  resize
);


resize();


/*
==================================================
APPLE TV CASTING
==================================================
*/

const castButton =
  document.getElementById(
    "cast-button"
  );


let isCasting =
  false;


async function refreshCastStatus() {

  if (
    !window.casting
  ) {

    return;

  }


  try {

    const result =
      await window.casting
        .status();


    if (
      result.status ===
      "starting"
    ) {

      isCasting =
        true;


      castButton.textContent =
        "Connecting...";


    } else if (
      result.status ===
      "casting"
    ) {

      isCasting =
        true;


      castButton.textContent =
        "Stop Casting";


    } else {

      isCasting =
        false;


      castButton.textContent =
        "Cast to Apple TV";

    }

  } catch (error) {

    console.error(
      "Cast status error:",
      error
    );

  }

}


castButton.addEventListener(
  "click",
  async () => {

    if (
      !window.casting
    ) {

      return;

    }


    castButton.disabled =
      true;


    try {


      if (
        isCasting
      ) {

        castButton.textContent =
          "Stopping...";


        await window.casting
          .stop();


        isCasting =
          false;


        castButton.textContent =
          "Cast to Apple TV";


      } else {

        castButton.textContent =
          "Connecting...";


        await window.casting
          .start();


        isCasting =
          true;

      }


    } catch (error) {

      console.error(
        "Casting error:",
        error
      );


      isCasting =
        false;


      castButton.textContent =
        "Cast Failed";

    }


    castButton.disabled =
      false;


    setTimeout(
      refreshCastStatus,
      500
    );

  }
);


setInterval(
  refreshCastStatus,
  1500
);


refreshCastStatus();


/*
==================================================
SPOTIFY ELEMENTS
==================================================
*/

const spotifyPanel =
  document.getElementById(
    "spotify-panel"
  );


const spotifyArt =
  document.getElementById(
    "spotify-art"
  );


const spotifyStatus =
  document.getElementById(
    "spotify-status"
  );


const spotifyTitle =
  document.getElementById(
    "spotify-title"
  );


const spotifyArtist =
  document.getElementById(
    "spotify-artist"
  );


const spotifyAlbum =
  document.getElementById(
    "spotify-album"
  );


const spotifyProgressFill =
  document.getElementById(
    "spotify-progress-fill"
  );


const spotifyPosition =
  document.getElementById(
    "spotify-position"
  );


const spotifyDuration =
  document.getElementById(
    "spotify-duration"
  );


/*
==================================================
SPOTIFY STATE
==================================================
*/

let spotifyState =
  null;


let spotifySyncTime =
  performance.now();


function formatTime(ms) {

  if (
    !Number.isFinite(ms) ||
    ms < 0
  ) {

    return "0:00";

  }


  const seconds =
    Math.floor(
      ms /
      1000
    );


  const minutes =
    Math.floor(
      seconds /
      60
    );


  const remaining =
    seconds %
    60;


  return (

    minutes +
    ":" +
    String(
      remaining
    ).padStart(
      2,
      "0"
    )

  );

}


/*
==================================================
UPDATE SPOTIFY
==================================================
*/

async function updateSpotify() {

  if (
    !window.spotify
  ) {

    return;

  }


  try {

    const data =
      await window.spotify
        .getNowPlaying();


    if (
      !data ||
      !data.available
    ) {

      spotifyPanel.style.display =
        "none";


      spotifyState =
        null;


      return;

    }


    spotifyState =
      data;


    spotifySyncTime =
      performance.now();


    spotifyPanel.style.display =
      "flex";


    spotifyTitle.textContent =
      data.title ||
      "Unknown Song";


    spotifyArtist.textContent =
      data.artist ||
      "Unknown Artist";


    spotifyAlbum.textContent =
      data.album ||
      "";


    spotifyStatus.textContent =
      data.isPlaying
        ? "NOW PLAYING"
        : "PAUSED";


    if (
      data.artUrl &&
      spotifyArt.src !==
      data.artUrl
    ) {

      spotifyArt.src =
        data.artUrl;

    }


    spotifyDuration.textContent =
      formatTime(
        data.durationMs
      );


  } catch (error) {

    console.error(
      "Spotify update error:",
      error
    );

  }

}


setInterval(
  updateSpotify,
  1500
);


updateSpotify();


/*
==================================================
SMOOTH SPOTIFY TIMER
==================================================
*/

function updateSpotifyProgress() {

  requestAnimationFrame(
    updateSpotifyProgress
  );


  if (
    !spotifyState
  ) {

    return;

  }


  let position =
    spotifyState.positionMs;


  if (
    spotifyState.isPlaying
  ) {

    position +=

      performance.now() -
      spotifySyncTime;

  }


  position =
    Math.max(

      0,

      Math.min(
        position,
        spotifyState.durationMs
      )

    );


  const percentage =

    spotifyState.durationMs > 0

      ?

      (
        position /
        spotifyState.durationMs
      ) *
      100

      :

      0;


  spotifyProgressFill.style.width =
    percentage +
    "%";


  spotifyPosition.textContent =
    formatTime(
      position
    );


  spotifyDuration.textContent =
    formatTime(
      spotifyState.durationMs
    );

}


updateSpotifyProgress();


/*
==================================================
START VISUALIZER
==================================================
*/

startButton.onclick =
  async () => {


  try {


    /*
    ==================================================
    AUDIO INPUT
    ==================================================
    */

    const stream =
      await navigator.mediaDevices
        .getUserMedia({

          audio: {

            channelCount:
              1,

            sampleRate:
              48000,

            echoCancellation:
              false,

            noiseSuppression:
              false,

            autoGainControl:
              false

          }

        });


    const audioContext =
      new AudioContext({

        sampleRate:
          48000

      });


    await audioContext.resume();


    /*
    ==================================================
    AUDIO PIPELINE
    ==================================================
    */

    const source =
      audioContext
        .createMediaStreamSource(
          stream
        );


    const gainNode =
      audioContext
        .createGain();


    gainNode.gain.value =
      4.0;


    const highPass =
      audioContext
        .createBiquadFilter();


    highPass.type =
      "highpass";


    highPass.frequency.value =
      45;


    highPass.Q.value =
      0.7;


    const analyser =
      audioContext
        .createAnalyser();


    analyser.fftSize =
      4096;


    analyser.smoothingTimeConstant =
      0.55;


    analyser.minDecibels =
      -105;


    analyser.maxDecibels =
      -15;


    source.connect(
      gainNode
    );


    gainNode.connect(
      highPass
    );


    highPass.connect(
      analyser
    );


    /*
    ==================================================
    DATA
    ==================================================
    */

    const waveform =
      new Uint8Array(
        analyser.fftSize
      );


    const smoothWaveform =
      new Float32Array(
        analyser.fftSize
      );


    smoothWaveform.fill(
      128
    );


    const spectrum =
      new Uint8Array(
        analyser.frequencyBinCount
      );


    startButton.remove();


    /*
    ==================================================
    GLOBAL SMOOTHING
    ==================================================
    */

    let smoothBass =
      0;


    let smoothMids =
      0;


    let smoothTreble =
      0;


    let huePosition =
      0;


    /*
    ==================================================
    BAR SETTINGS
    ==================================================
    */

    const barCount =
      64;


    const smoothBars =
      new Array(
        barCount
      ).fill(
        0
      );


    const barRiseSpeed =
      0.70;


    const barFallSpeed =
      0.18;


    /*
    ==================================================
    WAVEFORM SETTINGS
    ==================================================

    Lower = calmer.

    0.10 provides smoother movement
    than the original waveform.
    */

    const waveformSpeed =
      0.10;


    /*
    ==================================================
    FREQUENCY HELPER
    ==================================================
    */

    function frequencyToBin(
      freq
    ) {

      const nyquist =
        audioContext.sampleRate /
        2;


      return Math.round(

        freq /
        nyquist *
        spectrum.length

      );

    }


    /*
    ==================================================
    DRAW LOOP
    ==================================================
    */

    function draw() {


      requestAnimationFrame(
        draw
      );


      analyser
        .getByteTimeDomainData(
          waveform
        );


      analyser
        .getByteFrequencyData(
          spectrum
        );


      /*
      ==================================================
      FREQUENCY ENERGY
      ==================================================
      */

      const bassStart =
        frequencyToBin(
          45
        );


      const bassEnd =
        frequencyToBin(
          250
        );


      const midEnd =
        frequencyToBin(
          4000
        );


      const trebleEnd =
        frequencyToBin(
          12000
        );


      let bass =
        0;


      let mids =
        0;


      let treble =
        0;


      /*
      Bass.
      */

      for (
        let i = bassStart;
        i < bassEnd;
        i++
      ) {

        bass +=
          spectrum[i];

      }


      bass /=
        Math.max(

          1,

          bassEnd -
          bassStart

        );


      /*
      Mids.
      */

      for (
        let i = bassEnd;
        i < midEnd;
        i++
      ) {

        mids +=
          spectrum[i];

      }


      mids /=
        Math.max(

          1,

          midEnd -
          bassEnd

        );


      /*
      Treble.
      */

      for (
        let i = midEnd;
        i < trebleEnd;
        i++
      ) {

        treble +=
          spectrum[i];

      }


      treble /=
        Math.max(

          1,

          trebleEnd -
          midEnd

        );


      /*
      Smooth energy.
      */

      smoothBass +=

        (
          bass -
          smoothBass
        ) *
        0.12;


      smoothMids +=

        (
          mids -
          smoothMids
        ) *
        0.10;


      smoothTreble +=

        (
          treble -
          smoothTreble
        ) *
        0.10;


      /*
      ==================================================
      DYNAMIC COLOR
      ==================================================
      */

      const hueSpeed =

        0.10 +
        smoothBass /
        220;


      huePosition +=
        hueSpeed;


      if (
        huePosition >=
        360
      ) {

        huePosition -=
          360;

      }


      const hue =

        (
          huePosition +
          smoothBass *
          0.8
        ) %
        360;


      const saturation =

        Math.min(

          100,

          70 +
          smoothMids *
          0.12

        );


      const lightness =

        Math.min(

          72,

          38 +
          smoothTreble *
          0.14

        );


      const dynamicColor =

        `hsl(
          ${hue},
          ${saturation}%,
          ${lightness}%
        )`;


      /*
      ==================================================
      CLEAR
      ==================================================
      */

      ctx.fillStyle =
        "black";


      ctx.fillRect(

        0,
        0,

        canvas.width,
        canvas.height

      );


      /*
      ==================================================
      CALM WAVEFORM
      ==================================================
      */

      const centerY =

        canvas.height *
        0.30;


      /*
      Reduced bass expansion.
      */

      const amplitudeBoost =

        1 +
        smoothBass /
        350;


      /*
      Smaller overall waveform.
      */

      const amplitude =

        canvas.height *
        0.14 *
        amplitudeBoost;


      const sliceWidth =

        canvas.width /
        waveform.length;


      /*
      Softer glow.
      */

      const glow =

        8 +
        smoothMids /
        4;


      ctx.lineWidth =

        2.0 +
        smoothBass /
        300;


      ctx.strokeStyle =
        dynamicColor;


      ctx.shadowColor =
        dynamicColor;


      ctx.shadowBlur =
        glow;


      ctx.beginPath();


      let x =
        0;


      for (
        let i = 0;
        i < waveform.length;
        i++
      ) {


        /*
        Smooth the waveform toward the
        current audio sample.
        */

        smoothWaveform[i] +=

          (
            waveform[i] -
            smoothWaveform[i]
          ) *
          waveformSpeed;


        const normalized =

          (
            smoothWaveform[i] -
            128
          ) /
          128;


        const y =

          centerY +
          normalized *
          amplitude;


        if (
          i === 0
        ) {

          ctx.moveTo(
            x,
            y
          );

        } else {

          ctx.lineTo(
            x,
            y
          );

        }


        x +=
          sliceWidth;

      }


      ctx.stroke();


      /*
      Thin highlight.
      */

      ctx.shadowBlur =
        0;


      ctx.lineWidth =
        0.8;


      ctx.strokeStyle =

        `hsl(
          ${hue},
          100%,
          78%
        )`;


      ctx.stroke();


      /*
      ==================================================
      CENTERED SPECTRUM
      ==================================================
      */

      const centerX =

        canvas.width /
        2;


      const halfWidth =

        canvas.width /
        2;


      const barWidth =

        halfWidth /
        barCount;


      const minFreq =
        45;


      const maxFreq =
        14000;


      /*
      ==================================================
      DRAW BARS
      ==================================================
      */

      for (
        let i = 0;
        i < barCount;
        i++
      ) {


        /*
        Logarithmic frequency mapping.
        */

        const fraction1 =

          i /
          barCount;


        const fraction2 =

          (
            i + 1
          ) /
          barCount;


        const freq1 =

          minFreq *

          Math.pow(

            maxFreq /
            minFreq,

            fraction1

          );


        const freq2 =

          minFreq *

          Math.pow(

            maxFreq /
            minFreq,

            fraction2

          );


        let startBin =

          frequencyToBin(
            freq1
          );


        let endBin =

          frequencyToBin(
            freq2
          );


        startBin =

          Math.max(
            0,
            startBin
          );


        endBin =

          Math.min(

            spectrum.length -
            1,

            endBin

          );


        if (
          endBin <=
          startBin
        ) {

          endBin =

            Math.min(

              spectrum.length -
              1,

              startBin +
              1

            );

        }


        /*
        Find strongest frequency value
        inside the band.
        */

        let value =
          0;


        for (
          let j = startBin;
          j <= endBin;
          j++
        ) {

          value =

            Math.max(

              value,

              spectrum[j]

            );

        }


        /*
        ==================================================
        CENTER NOISE GATE
        ==================================================
        */

        const centerGateBars =
          12;


        const centerGateBoost =

          i <
          centerGateBars

            ?

            0.07 *

            (
              1 -
              i /
              centerGateBars
            )

            :

            0;


        const noiseGate =

          0.10 +
          centerGateBoost;


        let normalized =

          value /
          255;


        if (
          normalized <
          noiseGate
        ) {

          normalized =
            0;

        } else {


          normalized =

            (
              normalized -
              noiseGate
            ) /

            (
              1 -
              noiseGate
            );


          /*
          Quiet-signal boost.
          */

          normalized =

            Math.pow(

              normalized,

              0.50

            );

        }


        normalized =

          Math.min(

            1,

            Math.max(

              0,

              normalized

            )

          );


        /*
        ==================================================
        BAR MOVEMENT
        ==================================================
        */

        if (
          normalized >
          smoothBars[i]
        ) {

          smoothBars[i] +=

            (
              normalized -
              smoothBars[i]
            ) *

            barRiseSpeed;

        } else {

          smoothBars[i] +=

            (
              normalized -
              smoothBars[i]
            ) *

            barFallSpeed;

        }


        if (
          smoothBars[i] <
          0.003
        ) {

          smoothBars[i] =
            0;

        }


        const displayedValue =

          smoothBars[i];


        /*
        ==================================================
        HEIGHT
        ==================================================
        */

        const height =

          displayedValue *
          canvas.height *
          0.38;


        /*
        ==================================================
        BAR COLOR
        ==================================================
        */

        const barHue =

          (
            hue +

            i *
            3 +

            value *
            0.12

          ) %
          360;


        const barLightness =

          35 +

          displayedValue *
          35;


        const barColor =

          `hsl(
            ${barHue},
            95%,
            ${barLightness}%
          )`;


        ctx.fillStyle =
          barColor;


        ctx.shadowColor =
          barColor;


        ctx.shadowBlur =

          4 +

          displayedValue *
          18;


        /*
        ==================================================
        MIRRORED POSITION
        ==================================================
        */

        const offset =

          i *
          barWidth;


        const rightX =

          centerX +
          offset;


        const leftX =

          centerX -
          offset -
          barWidth;


        const y =

          canvas.height -
          height;


        /*
        Right side.
        */

        ctx.fillRect(

          rightX,

          y,

          Math.max(

            1,

            barWidth -
            2

          ),

          height

        );


        /*
        Left side.
        */

        ctx.fillRect(

          leftX,

          y,

          Math.max(

            1,

            barWidth -
            2

          ),

          height

        );

      }


      ctx.shadowBlur =
        0;

    }


    draw();


  } catch (error) {


    console.error(
      error
    );


    alert(

      "Could not access the audio input.\n\n" +
      error.message

    );

  }

};

</script>

</body>

</html>
