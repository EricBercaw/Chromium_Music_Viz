<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Music Visualizer</title>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
      cursor: none;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    #start {
      position: fixed;
      inset: 0;
      margin: auto;
      width: 240px;
      height: 64px;
      font-size: 20px;
      z-index: 2;
      cursor: pointer;
    }
  </style>
</head>

<body>

<button id="start">Start Visualizer</button>

<canvas id="canvas"></canvas>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const startButton = document.getElementById("start");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

window.addEventListener("resize", resize);
resize();


startButton.onclick = async () => {

  try {

    /*
    ==================================================
    AUDIO INPUT
    ==================================================
    */

    const stream =
      await navigator.mediaDevices.getUserMedia({
        audio: {
          channelCount: 1,
          sampleRate: 48000,

          echoCancellation: false,
          noiseSuppression: false,
          autoGainControl: false
        }
      });


    const audioContext =
      new AudioContext({
        sampleRate: 48000
      });


    await audioContext.resume();


    /*
    ==================================================
    AUDIO SOURCE
    ==================================================
    */

    const source =
      audioContext.createMediaStreamSource(stream);


    /*
    ==================================================
    GAIN
    ==================================================
    */

    const gainNode =
      audioContext.createGain();

    gainNode.gain.value = 4.0;


    /*
    ==================================================
    HIGH-PASS FILTER
    ==================================================

    Slightly stronger cutoff than before.

    This helps remove low-frequency rumble,
    DC offset, and electrical noise that can
    make the center bars stay elevated.
    */

    const highPass =
      audioContext.createBiquadFilter();

    highPass.type = "highpass";

    highPass.frequency.value = 45;

    highPass.Q.value = 0.7;


    /*
    ==================================================
    ANALYSER
    ==================================================
    */

    const analyser =
      audioContext.createAnalyser();


    analyser.fftSize = 4096;


    /*
    Lower smoothing gives fast response.
    */

    analyser.smoothingTimeConstant = 0.55;


    /*
    Makes quiet audio visible.
    */

    analyser.minDecibels = -105;

    analyser.maxDecibels = -15;


    /*
    Audio pipeline:

    USB input
       ↓
    Gain
       ↓
    High-pass filter
       ↓
    Analyser
    */

    source.connect(gainNode);

    gainNode.connect(highPass);

    highPass.connect(analyser);


    /*
    ==================================================
    DATA ARRAYS
    ==================================================
    */

    const waveform =
      new Uint8Array(
        analyser.fftSize
      );


    const spectrum =
      new Uint8Array(
        analyser.frequencyBinCount
      );


    startButton.remove();


    /*
    ==================================================
    SMOOTH GLOBAL AUDIO VALUES
    ==================================================
    */

    let smoothBass = 0;

    let smoothMids = 0;

    let smoothTreble = 0;

    let huePosition = 0;


    /*
    ==================================================
    SPECTRUM BAR SETTINGS
    ==================================================
    */

    const barCount = 64;


    /*
    Stored height for each bar.
    */

    const smoothBars =
      new Array(barCount).fill(0);


    /*
    Fast bar response.
    */

    const barRiseSpeed = 0.70;

    const barFallSpeed = 0.18;


    /*
    ==================================================
    FREQUENCY → FFT BIN
    ==================================================
    */

    function frequencyToBin(freq) {

      const nyquist =
        audioContext.sampleRate / 2;


      return Math.round(
        freq /
        nyquist *
        spectrum.length
      );

    }


    /*
    ==================================================
    DRAW LOOP
    ==================================================
    */

    function draw() {

      requestAnimationFrame(draw);


      analyser.getByteTimeDomainData(
        waveform
      );


      analyser.getByteFrequencyData(
        spectrum
      );


      /*
      ==================================================
      BASS / MID / TREBLE ENERGY
      ==================================================
      */

      const bassStart =
        frequencyToBin(45);


      const bassEnd =
        frequencyToBin(250);


      const midEnd =
        frequencyToBin(4000);


      const trebleEnd =
        frequencyToBin(12000);


      let bass = 0;

      let mids = 0;

      let treble = 0;


      /*
      Bass
      */

      for (
        let i = bassStart;
        i < bassEnd;
        i++
      ) {

        bass += spectrum[i];

      }


      bass /=
        Math.max(
          1,
          bassEnd - bassStart
        );


      /*
      Mids
      */

      for (
        let i = bassEnd;
        i < midEnd;
        i++
      ) {

        mids += spectrum[i];

      }


      mids /=
        Math.max(
          1,
          midEnd - bassEnd
        );


      /*
      Treble
      */

      for (
        let i = midEnd;
        i < trebleEnd;
        i++
      ) {

        treble += spectrum[i];

      }


      treble /=
        Math.max(
          1,
          trebleEnd - midEnd
        );


      /*
      Smooth overall frequency values.
      */

      smoothBass +=
        (bass - smoothBass) *
        0.12;


      smoothMids +=
        (mids - smoothMids) *
        0.10;


      smoothTreble +=
        (treble - smoothTreble) *
        0.10;


      /*
      ==================================================
      DYNAMIC COLOR
      ==================================================
      */

      const hueSpeed =
        0.10 +
        smoothBass / 220;


      huePosition += hueSpeed;


      if (huePosition >= 360) {

        huePosition -= 360;

      }


      const hue =
        (
          huePosition +
          smoothBass * 0.8
        ) % 360;


      const saturation =
        Math.min(
          100,
          70 +
          smoothMids * 0.12
        );


      const lightness =
        Math.min(
          72,
          38 +
          smoothTreble * 0.14
        );


      const dynamicColor =
        `hsl(
          ${hue},
          ${saturation}%,
          ${lightness}%
        )`;


      /*
      ==================================================
      CLEAR SCREEN
      ==================================================
      */

      ctx.fillStyle = "black";


      ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
      );


      /*
      ==================================================
      OSCILLOSCOPE WAVEFORM
      ==================================================
      */

      const centerY =
        canvas.height *
        0.30;


      const amplitudeBoost =
        1 +
        smoothBass /
        150;


      const amplitude =
        canvas.height *
        0.22 *
        amplitudeBoost;


      const sliceWidth =
        canvas.width /
        waveform.length;


      const glow =
        12 +
        smoothMids /
        2.5;


      ctx.lineWidth =
        2.5 +
        smoothBass /
        140;


      ctx.strokeStyle =
        dynamicColor;


      ctx.shadowColor =
        dynamicColor;


      ctx.shadowBlur =
        glow;


      ctx.beginPath();


      let x = 0;


      for (
        let i = 0;
        i < waveform.length;
        i++
      ) {

        const normalized =
          (
            waveform[i] -
            128
          ) /
          128;


        const y =
          centerY +
          normalized *
          amplitude;


        if (i === 0) {

          ctx.moveTo(
            x,
            y
          );

        } else {

          ctx.lineTo(
            x,
            y
          );

        }


        x += sliceWidth;

      }


      ctx.stroke();


      /*
      Bright center line.
      */

      ctx.shadowBlur = 0;

      ctx.lineWidth = 1;


      ctx.strokeStyle =
        `hsl(
          ${hue},
          100%,
          78%
        )`;


      ctx.stroke();


      /*
      ==================================================
      CENTERED LOGARITHMIC SPECTRUM
      ==================================================

      TREBLE ← MID ← BASS | BASS → MID → TREBLE
      */

      const centerX =
        canvas.width / 2;


      const halfWidth =
        canvas.width / 2;


      const barWidth =
        halfWidth /
        barCount;


      /*
      Start slightly higher than before
      to avoid low-frequency rumble.
      */

      const minFreq = 45;

      const maxFreq = 14000;


      /*
      ==================================================
      DRAW EACH FREQUENCY BAR
      ==================================================
      */

      for (
        let i = 0;
        i < barCount;
        i++
      ) {


        /*
        --------------------------------------------------
        LOGARITHMIC FREQUENCY MAPPING
        --------------------------------------------------
        */

        const fraction1 =
          i /
          barCount;


        const fraction2 =
          (
            i + 1
          ) /
          barCount;


        const freq1 =
          minFreq *
          Math.pow(
            maxFreq /
            minFreq,
            fraction1
          );


        const freq2 =
          minFreq *
          Math.pow(
            maxFreq /
            minFreq,
            fraction2
          );


        let startBin =
          frequencyToBin(
            freq1
          );


        let endBin =
          frequencyToBin(
            freq2
          );


        startBin =
          Math.max(
            0,
            startBin
          );


        endBin =
          Math.min(
            spectrum.length - 1,
            endBin
          );


        if (
          endBin <= startBin
        ) {

          endBin =
            Math.min(
              spectrum.length - 1,
              startBin + 1
            );

        }


        /*
        --------------------------------------------------
        FIND STRONGEST VALUE IN THIS BAND
        --------------------------------------------------
        */

        let value = 0;


        for (
          let j = startBin;
          j <= endBin;
          j++
        ) {

          value =
            Math.max(
              value,
              spectrum[j]
            );

        }


        /*
        ==================================================
        DYNAMIC NOISE GATE
        ==================================================

        The center bars get a stronger gate.

        i = 0 is the center.

        By bar 12, the extra center gate
        has faded away completely.

        Center:
          about 0.17

        Outer bars:
          0.10
        */

        const centerGateBars = 12;


        const centerGateBoost =
          i < centerGateBars
            ? 0.055 *
              (
                1 -
                i /
                centerGateBars
              )
            : 0;


        const noiseGate =
          0.10 +
          centerGateBoost;


        let normalized =
          value / 255;


        if (
          normalized <
          noiseGate
        ) {

          normalized = 0;

        } else {


          /*
          Remove the noise gate portion
          and remap the remaining signal.
          */

          normalized =
            (
              normalized -
              noiseGate
            ) /
            (
              1 -
              noiseGate
            );


          /*
          ==================================================
          QUIET-SIGNAL BOOST
          ==================================================

          Makes real quiet music respond strongly.
          */

          normalized =
            Math.pow(
              normalized,
              0.50
            );

        }


        normalized =
          Math.min(
            1,
            Math.max(
              0,
              normalized
            )
          );


        /*
        ==================================================
        BAR SMOOTHING
        ==================================================
        */

        if (
          normalized >
          smoothBars[i]
        ) {

          /*
          Rising
          */

          smoothBars[i] +=
            (
              normalized -
              smoothBars[i]
            ) *
            barRiseSpeed;

        } else {

          /*
          Falling
          */

          smoothBars[i] +=
            (
              normalized -
              smoothBars[i]
            ) *
            barFallSpeed;

        }


        /*
        Snap tiny values to zero.
        */

        if (
          smoothBars[i] <
          0.003
        ) {

          smoothBars[i] = 0;

        }


        const displayedValue =
          smoothBars[i];


        /*
        ==================================================
        BAR HEIGHT
        ==================================================
        */

        const height =
          displayedValue *
          canvas.height *
          0.38;


        /*
        ==================================================
        BAR COLOR
        ==================================================
        */

        const barHue =
          (
            hue +
            i * 3 +
            value * 0.12
          ) % 360;


        const barLightness =
          35 +
          displayedValue *
          35;


        const barColor =
          `hsl(
            ${barHue},
            95%,
            ${barLightness}%
          )`;


        ctx.fillStyle =
          barColor;


        ctx.shadowColor =
          barColor;


        ctx.shadowBlur =
          4 +
          displayedValue *
          18;


        /*
        ==================================================
        CENTERED BAR POSITIONS
        ==================================================
        */

        const offset =
          i *
          barWidth;


        const rightX =
          centerX +
          offset;


        const leftX =
          centerX -
          offset -
          barWidth;


        const y =
          canvas.height -
          height;


        /*
        RIGHT BAR
        */

        ctx.fillRect(
          rightX,
          y,
          Math.max(
            1,
            barWidth - 2
          ),
          height
        );


        /*
        LEFT BAR
        */

        ctx.fillRect(
          leftX,
          y,
          Math.max(
            1,
            barWidth - 2
          ),
          height
        );

      }


      ctx.shadowBlur = 0;

    }


    draw();


  } catch (error) {


    console.error(
      error
    );


    alert(
      "Could not access the audio input.\n\n" +
      error.message
    );

  }

};

</script>

</body>
</html>
